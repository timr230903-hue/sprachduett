# Baut Sprachduett auf einem GitHub-macOS-Runner, testet den Fachkern und lädt zu TestFlight hoch.
# Signierung manuell. Secrets (wie Vorrat): ASC_KEY_P8, DIST_CERT_P12, DIST_CERT_PASSWORD, PROFILE.
# ASC_KEY_ID und ASC_ISSUER_ID stehen hier, nicht in Secrets. Team 3YVJ6AK57U.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build-Nummer (leer = github.run_number; wird bei Bedarf erhöht)"
        required: false
        default: ""
      upload:
        description: "Zu TestFlight hochladen"
        type: boolean
        required: false
        default: true
  push:
    branches: [main]

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEAM_ID: 3YVJ6AK57U
  BUNDLE_ID: de.timroot.sprachduett
  ASC_KEY_ID: 5DPB4C6LCQ
  ASC_ISSUER_ID: 9317135c-5c0e-4e25-ab66-1220d739ce53
  EXPECTED_APP_ID: "6836831879"
  PROJECT: Sprachduett.xcodeproj
  SCHEME: Sprachduett
  LOG_DIR: build-logs
  EXPECTED_PROFILE_NAME: Sprachduett App Store CI
  SIGN_IDENTITY: Apple Distribution
  CLOUD_CONTAINER: iCloud.de.timroot.sprachduett
  DO_UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}

jobs:
  testflight:
    name: Test, Archiv, TestFlight-Upload
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode wählen (neueste stabile Version)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Umgebung
        run: |
          mkdir -p "$LOG_DIR"
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          [ "$SDK" -ge 26 ] || { echo "::error::iOS-SDK $SDK < 26 – App Store Connect verlangt Xcode 26."; exit 1; }
          echo "Upload: $DO_UPLOAD"

      - name: Tests des Fachkerns (swift test)
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$LOG_DIR/swift-test.log"

      - name: API-Schlüssel schreiben
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_P8:-}" ]; then
            echo "::error::Repository-Secret ASC_KEY_P8 fehlt."
            exit 1
          fi
          mkdir -p ~/private_keys
          KEY=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          if printf '%s' "$ASC_KEY_P8" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            {
              echo '-----BEGIN PRIVATE KEY-----'
              printf '%s' "$ASC_KEY_P8" | tr -d ' \r\n\t' | fold -w 64
              echo
              echo '-----END PRIVATE KEY-----'
            } > "$KEY"
          fi
          chmod 600 "$KEY"
          openssl pkey -in "$KEY" -noout
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Zertifikat und Profil installieren
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROFILE }}
        run: |
          set -euo pipefail
          for v in DIST_CERT_P12 DIST_CERT_PASSWORD PROFILE_B64; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret ${v%_B64} fehlt."
              exit 1
            fi
          done
          P12="$RUNNER_TEMP/dist.p12"
          PROF="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$P12"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROF"

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PW"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -f pkcs12 -A \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "$SIGN_IDENTITY" || {
            echo "::error::Keine Identität '$SIGN_IDENTITY' (DIST_CERT_P12 / DIST_CERT_PASSWORD, Zertifikat M7JL49W67G)."; exit 1; }

          security cms -D -i "$PROF" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          echo "Profil: $NAME ($UUID), App-ID $APPID"
          if [ "$NAME" != "$EXPECTED_PROFILE_NAME" ]; then
            echo "::warning::Profilname '$NAME' weicht von '$EXPECTED_PROFILE_NAME' ab; nutze '$NAME'."
          fi
          if [ "$APPID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Profil gehört zu $APPID, erwartet $TEAM_ID.$BUNDLE_ID."; exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers' "$RUNNER_TEMP/profile.plist" | grep -q "$CLOUD_CONTAINER" || {
            echo "::error::Profil enthält $CLOUD_CONTAINER nicht."; exit 1; }
          echo "Profil-Entitlements:"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist"
          APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist")
          if [ "$APS" != "production" ]; then
            echo "::error::aps-environment ist '$APS', erwartet production."; exit 1
          fi
          ENT=Config/Sprachduett-YES.entitlements
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-environment' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :com.apple.developer.icloud-container-environment Development' "$ENT"
            echo "CloudKit-Container-Umgebung im TestFlight-Build: Development"
          else
            /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.icloud-container-environment' "$ENT" || true
            echo "Profil ohne icloud-container-environment, Schlüssel aus den App-Entitlements genommen."
          fi
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$PROF" "$d/$UUID.mobileprovision"
          done
          {
            echo "KEYCHAIN=$KEYCHAIN"
            echo "PROFILE_NAME=$NAME"
            echo "PROFILE_UUID=$UUID"
            echo "SPRACHDUETT_CLOUDKIT_ENABLED=YES"
          } >> "$GITHUB_ENV"

      - name: App Store Connect prüfen
        env:
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check cryptography
          "$RUNNER_TEMP/venv/bin/python" ci/asc_preflight.py

      - name: Xcode-Projekt erzeugen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: UI-Tests (Simulator)
        run: |
          set -o pipefail
          FORMAT=cat
          command -v xcbeautify >/dev/null && FORMAT="xcbeautify --renderer github-actions"
          DEST=$(python3 - << 'PY'
          import subprocess
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available"], text=True)
          name = ""
          for line in out.splitlines():
              if "iPhone" in line and "unavailable" not in line.lower():
                  name = line.split("(")[0].strip()
                  break
          if not name:
              raise SystemExit("Kein iPhone-Simulator")
          print(f"platform=iOS Simulator,name={name}")
          PY
          )
          echo "UI-Test-Ziel: $DEST"
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DEST" \
            -only-testing:SprachduettUITests \
            -resultBundlePath "$LOG_DIR/uitest.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOG_DIR/uitest.log" | $FORMAT

      - name: Archiv bauen und signieren
        run: |
          set -o pipefail
          FORMAT=cat
          command -v xcbeautify >/dev/null && FORMAT="xcbeautify --renderer github-actions"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sprachduett.xcarchive" \
            -resultBundlePath "$LOG_DIR/archive.xcresult" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            APP_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPRACHDUETT_CLOUDKIT_ENABLED=YES \
            2>&1 | tee "$LOG_DIR/archive.log" | $FORMAT

      - name: Archiv prüfen
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Sprachduett.xcarchive/Products/Applications/Sprachduett.app"
          PLIST="$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SprachduettCloudKitEnabled' "$PLIST")" = "YES"
          codesign -d --entitlements :- "$APP" > "$LOG_DIR/entitlements.plist"
          grep -q "$CLOUD_CONTAINER" "$LOG_DIR/entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$LOG_DIR/entitlements.plist")" = "production"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-environment' "$LOG_DIR/entitlements.plist")" = "Development"
          grep -q "CloudKit" "$LOG_DIR/entitlements.plist"
          echo "Entitlements im Archiv:"
          cat "$LOG_DIR/entitlements.plist"

      - name: Exportieren und zu TestFlight hochladen
        if: env.DO_UPLOAD == 'true'
        run: |
          set -o pipefail
          FORMAT=cat
          command -v xcbeautify >/dev/null && FORMAT="xcbeautify --renderer github-actions"
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cp ci/ExportOptions.plist "$OPTS"
          plutil -replace provisioningProfiles -json "{\"$BUNDLE_ID\":\"$PROFILE_NAME\"}" "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sprachduett.xcarchive" \
            -exportOptionsPlist "$OPTS" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$LOG_DIR/export.log" | $FORMAT

      - name: Xcode-Logs hochladen (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs-${{ github.run_number }}
          path: |
            ${{ env.LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Schlüssel und Profil entfernen
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
