# Xcode-Projekt wird in CI mit XcodeGen erzeugt (`xcodegen generate`).
name: Sprachduett
options:
  bundleIdPrefix: de.timroot
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "3YVJ6AK57U"
    CODE_SIGN_STYLE: Automatic
targets:
  Sprachduett:
    type: application
    platform: iOS
    sources:
      - path: Sprachduett
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timroot.sprachduett
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        # YES, sobald das Profil den Container iCloud.de.timroot.sprachduett enthält.
        # CI setzt das explizit. NO lässt die App vollständig lokal laufen.
        # Debug bleibt lokal signierbar. Release (TestFlight) schaltet iCloud ein.
        SPRACHDUETT_CLOUDKIT_ENABLED: "NO"
        CODE_SIGN_ENTITLEMENTS: Config/Sprachduett-$(SPRACHDUETT_CLOUDKIT_ENABLED).entitlements
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Sprachduett hört kurz zu, ob die thailändische Zeile erkannt wird. Wenn das iPhone es kann, bleibt die Erkennung auf dem Gerät."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Das Mikrofon wird nur benutzt, während ihr eine Zeile laut vorsagt."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Sprachduett
        INFOPLIST_KEY_CFBundleDevelopmentRegion: de
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SPRACHDUETT_CLOUDKIT_ENABLED: "NO"
          CODE_SIGN_STYLE: Automatic
        Release:
          SPRACHDUETT_CLOUDKIT_ENABLED: "YES"
          PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_SPECIFIER)
          CODE_SIGN_STYLE: Manual
  SprachduettUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SprachduettUITests
    dependencies:
      - target: Sprachduett
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.timroot.sprachduett.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sprachduett
schemes:
  Sprachduett:
    build:
      targets:
        Sprachduett: all
        SprachduettUITests: [test]
    test:
      targets:
        - SprachduettUITests
    run:
      config: Debug
